name: Suggest or add data to CUSP
description: Tell us about public or unpublished near-surface permafrost observations. A link is enough.
title: "[Data]: "
labels:
  - "type: dataset-candidate"
body:
  - type: markdown
    attributes:
      value: |
        Help make CUSP more complete. Paste a link or tell us about data you hold. A link alone is enough to get started.

        You do not need to format data for CUSP, investigate duplication, determine licensing, or write code. CUSP maintainers review and ingest accepted data, and original sources remain individually cited.

        **This issue is public.** Do not attach unpublished or restricted files or include private contact information. For nonpublic data, provide only public-safe context here and email [cusp.data@gmail.com](mailto:cusp.data@gmail.com). We will coordinate communications and data sharing by email.

  - type: textarea
    id: source
    attributes:
      label: What data should CUSP look at?
      description: Paste a dataset, paper, or repository link; a DOI or citation; or a brief description. For nonpublic data, a public-safe description is enough.
      placeholder: "Example: https://doi.org/... or a short description of an unpublished field dataset"
    validations:
      required: true

  - type: dropdown
    id: availability
    attributes:
      label: Where are the data?
      description: Choose the closest answer. It is fine if you are not sure.
      options:
        - Publicly available at the link above
        - Described or published, but I cannot find a download
        - Unpublished or not publicly available
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: observation_types
    attributes:
      label: What observations might the data contain?
      description: Select any that seem relevant. This is optional.
      multiple: true
      options:
        - Permafrost presence / absence
        - Active layer thickness / thaw depth / frost-table depth
        - Depth to permafrost
        - Soil pit / core / auger observations
        - Ground temperature observations
        - Field geophysics (for example GPR or ERT)
        - Soil or pedon data with permafrost-relevant observations
        - Unsure / other

  - type: textarea
    id: context
    attributes:
      label: Anything else you would like us to know?
      description: Optional context might include the region, dates, methods, approximate size, known overlap, or preferred citation.
      placeholder: "Share whatever is easy. You can leave this blank."

  - type: markdown
    attributes:
      value: |
        ### What happens next

        CUSP maintainers will investigate fit, access, permissions, and possible overlap with existing sources. We may follow up in this issue or by email, and we will use the issue to record the outcome.
