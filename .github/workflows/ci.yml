name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]" pytest

      - name: Validate processing-script metadata
        run: python -m cusp.generate_process_script_metadata --check --strict

      - name: Validate README data tracker
        run: python -m cusp.readme_tracker --check

      - name: Build canonical observation artifacts
        run: python -m cusp.build

      - name: Build 30 m aggregation artifacts
        run: python -m cusp.aggregate

      - name: Run test suite
        run: python -m pytest -q

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

      - name: Validate canonical observations
        run: python -m cusp.qc validate-observations --input data/cusp_observations.csv

      - name: Validate 30 m aggregation
        run: >-
          python -m cusp.qc validate-aggregated
          --input data/aggregated_30m.csv
          --membership data/aggregated_30m_membership.csv
