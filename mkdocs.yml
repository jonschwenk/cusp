site_name: CUSP
site_description: CommUnity near-Surface Permafrost dataset documentation
site_url: https://jonschwenk.github.io/cusp/
repo_url: https://github.com/jonschwenk/cusp
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: orange

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: This page's contents
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Get CUSP:
      - getting-started/index.md
      - Download The Data: getting-started/release-products.md
      - Caveats And Limits: getting-started/caveats.md
      - Using The Data: getting-started/using-the-data.md
      - Attribution And BibTeX: user/data-use-and-attribution.md
      - Data Schema: user/data-schema.md
      - Quality Flag Definitions: user/quality-flags.md
      - What CUSP Is: getting-started/what-is-cusp.md
  - Contribute:
      - contributing/index.md
      - Add GEE Features: contributing/adding-gee-features.md
  - Tools:
      - user/index.md
      - Installation: getting-started/installation.md
      - Aggregation: user/aggregation-guide.md
      - Feature Sampling: user/feature-sampling.md
      - Command Examples: user/cli-examples.md
      - Source Metadata: user/source-metadata.md
  - For Maintainers:
      - maintainers/index.md
      - Reproducibility:
          - reproducibility/index.md
          - Rebuild CUSP: reproducibility/rebuild-cusp.md
          - External Data Sources: reproducibility/external-data-sources.md
      - Data Ingestion: maintainers/adding-data.md
      - Process Script Headers: maintainers/process-script-header-guidelines.md
      - Source Release Clearance: maintainers/source-release-clearance-guidelines.md
      - release/index.md
      - Versioning And Exports: release/versioning-and-exports.md
      - QA Validation: release/qa-validation.md
      - Observation Build Validation: release/observation-build-validation.md
      - Aggregation Validation: release/aggregation-validation.md
